name: Reproducible Build

# Verifies the build is reproducible, not just configured to be.
#
# Directory.Build.props sets Deterministic and (when CI=true) ContinuousIntegrationBuild,
# which are the INPUTS to a reproducible build. This workflow checks the OUTPUT: it builds
# the same commit on Linux and Windows, hashes every DLL and PDB each src project produces,
# and fails when the two sets differ. .gitattributes forces LF checkouts, so source bytes are
# identical on both runners.
#
# Packages (.nupkg) are not compared: a zip embeds entry timestamps, so the bytes inside are
# what must match. See REPRODUCIBLE-BUILD.md for how a third party repeats the check.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducible-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hash:
    name: Hash build output (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build src projects and hash the output
        shell: bash
        run: |
          set -euo pipefail
          : > hashes.txt
          while IFS= read -r proj; do
            name="$(basename "$(dirname "$proj")")"
            dotnet build "$proj" -c Release --nologo -v:q -p:ContinuousIntegrationBuild=true
            (cd "$(dirname "$proj")/bin/Release" && find . -type f \( -name '*.dll' -o -name '*.pdb' \) -exec sha256sum {} +) \
              | sed -E "s#^([0-9a-f]+) [ *]\./#\1  ${name}/#" >> hashes.txt
          done < <(git ls-files 'src/**/*.csproj' 'src/*.csproj')
          LC_ALL=C sort -k2 -o hashes.txt hashes.txt
          test -s hashes.txt
          cat hashes.txt

      - name: Upload hashes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: hashes-${{ matrix.os }}
          path: hashes.txt
          if-no-files-found: error

      # The built files themselves, so a hash mismatch can be diagnosed byte by byte
      # instead of only seeing that two digests differ.
      - name: Upload built assemblies
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: output-${{ matrix.os }}
          path: |
            src/**/bin/Release/**/*.dll
            src/**/bin/Release/**/*.pdb
          retention-days: 7
          if-no-files-found: error

  compare:
    name: Compare Linux and Windows output
    needs: hash
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download hashes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: hashes

      - name: Fail when the outputs differ
        shell: bash
        run: |
          set -euo pipefail
          if diff -u hashes/hashes-ubuntu-latest/hashes.txt hashes/hashes-windows-latest/hashes.txt; then
            echo "Linux and Windows builds are byte-identical ($(wc -l < hashes/hashes-ubuntu-latest/hashes.txt) files)."
          else
            echo "::error::Build output differs between ubuntu-latest and windows-latest (diff above)."
            exit 1
          fi
